x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: postgres:16
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    logging: *default-logging
    build: ./backend
    image: ghcr.io/romulofgoes/aeroverso-backend:${IMAGE_TAG:-latest}
    volumes:
      - ./media:/backend/media          # imagens de artigo, compartilhadas com o Nginx no host
      - ./catalog:/backend/catalog  # saída do collectstatic, idem
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    logging: *default-logging
    build: 
      context: ./aeroverso
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: ghcr.io/romulofgoes/aeroverso-frontend:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  db_data:
